<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Trade Log Premium</title>
    <style>
        /* 基本のカラー設定：背景は黒、基本文字は白 */
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --input-bg: #2d2d2d;
            
            /* アクセントカラー（ご指定：陽線＝緑 / 陰線＝赤） */
            --color-yang: #38a169;    /* 陽線：緑 */
            --color-yin: #e53e3e;     /* 陰線：赤 */
            
            --color-long: #3182ce;    /* ロング：青 */
            --color-short: #e53e3e;   /* ショート：赤 (陰線と統一) */
            --color-win: #38a169;     /* 勝ち：緑 (陽線と統一) */
            --color-lose: #e53e3e;    /* 負け：赤 */
            --color-draw: #718096;    /* 建値：グレー */
        }

        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* タブメニューのスタイル */
        .tabs {
            display: flex;
            width: 100%;
            max-width: 600px;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border-color);
        }
        .tab-btn {
            flex: 1;
            padding: 15px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }
        .tab-btn.active {
            color: var(--text-color);
            border-bottom: 3px solid var(--color-long);
        }

        /* コンテナ（各画面の枠） */
        .container {
            background-color: var(--container-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            display: none;
        }
        .container.active {
            display: block;
        }

        h1, h2 {
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        /* フォーム関連のスタイル */
        .form-group {
            margin-bottom: 20px;
        }
        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--text-muted);
        }

        /* 入力エリア */
        input[type="text"], input[type="number"], input[type="date"], textarea {
            width: 100%;
            padding: 12px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 15px;
            box-sizing: border-box;
        }
        textarea { resize: vertical; height: 80px; }

        .flex-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        .flex-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }

        /* 選択ボタンのスタイル */
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .select-btn {
            flex: 1;
            min-width: 70px;
            padding: 10px;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-color);
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
        }
        .select-btn:hover { opacity: 0.8; }

        /* ボタン選択時のアクティブカラー（陽線＝緑 / 陰線＝赤） */
        .select-btn.active[data-type="pair"],
        .select-btn.active[data-type="market"] { background-color: #4a5568; border-color: #a0aec0; }
        .select-btn.active[data-val="Long"] { background-color: var(--color-long); border-color: #63b3ed; }
        .select-btn.active[data-val="Short"] { background-color: var(--color-short); border-color: #fc8181; }
        .select-btn.active[data-val="勝ち"] { background-color: var(--color-win); border-color: #68d391; }
        .select-btn.active[data-val="負け"] { background-color: var(--color-lose); border-color: #fc8181; }
        .select-btn.active[data-val="建値"] { background-color: var(--color-draw); border-color: #cbd5e0; }
        .select-btn.active[data-type="emotion"] { background-color: #b7791f; border-color: #ecc94b; }
        
        /* 環境認識・目線用カラー指定（ご希望の配色へ統一） */
        .select-btn.active[data-val="陽線"] { background-color: var(--color-yang); border-color: #68d391; }
        .select-btn.active[data-val="陰線"] { background-color: var(--color-yin); border-color: #fc8181; }
        .select-btn.active[data-val="ロング"] { background-color: var(--color-long); border-color: #63b3ed; }
        .select-btn.active[data-val="ショート"] { background-color: var(--color-short); border-color: #fc8181; }
        .select-btn.active[data-val="レンジ"] { background-color: var(--color-draw); border-color: #cbd5e0; }

        #customPairInput { margin-top: 8px; display: none; }

        /* 実行系ボタン */
        .action-btn {
            background-color: var(--color-long);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            margin-top: 10px;
        }
        .action-btn:hover { opacity: 0.9; }

        /* 時間変換エリア */
        .convert-box {
            background-color: #1a202c;
            padding: 15px;
            border-radius: 8px;
            border: 1px dashed #4a5568;
        }
        .switch-label {
            display: flex;
            align-items: center;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            margin-top: 8px;
        }
        .switch-label input { margin-right: 5px; }

        /* 一覧・件数表示用ヘッダー */
        .list-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border-color);
        }
        .count-text { font-size: 16px; font-weight: bold; color: var(--text-muted); }
        .nav-trigger-btn {
            background-color: var(--color-win);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }

        /* トレード記録カード */
        .trade-card {
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .card-row1 { display: flex; justify-content: space-between; margin-bottom: 8px; font-size: 13px; color: var(--text-muted); }
        .card-row2 { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; flex-wrap: wrap; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; color: white; }
        .badge.Long { background-color: var(--color-long); }
        .badge.Short { background-color: var(--color-short); }
        .badge.勝ち { background-color: var(--color-win); }
        .badge.負け { background-color: var(--color-lose); }
        .badge.建値 { background-color: var(--color-draw); }
        .badge.env { background-color: #4a5568; color: #e2e8f0; }
        .card-pair { font-size: 18px; font-weight: bold; margin-right: 5px; }
        .card-metrics { display: flex; gap: 15px; font-size: 13px; margin-bottom: 8px; background: #121212; padding: 8px; border-radius: 4px; flex-wrap: wrap; }
        .card-prices { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); margin-bottom: 10px; padding: 0 4px; flex-wrap: wrap; }
        .card-memo { font-size: 13px; color: #dddddd; border-top: 1px solid #333; padding-top: 8px; word-break: break-all; margin-bottom: 10px; }
        
        /* カード操作ボタンエリア */
        .card-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            border-top: 1px dashed #333;
            padding-top: 8px;
        }
        .card-op-btn {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            padding: 4px 8px;
        }
        .card-op-btn.edit { color: var(--color-long); }
        .card-op-btn.delete { color: var(--color-lose); }

        /* バックアップセクション */
        .backup-section {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid var(--border-color);
            text-align: center;
        }
        .backup-btn {
            background-color: #4a5568;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
        }

        /* 統計画面 */
        .stat-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }
        .stat-card {
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid var(--border-color);
        }
        .stat-val { font-size: 20px; font-weight: bold; margin-top: 5px; }
        .stat-list {
            text-align: left;
            font-size: 14px;
            background-color: var(--input-bg);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .stat-item {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px solid #2d2d2d;
        }
    </style>
</head>
<body>

    <div class="tabs">
        <button id="btn-tab-record" class="tab-btn active" onclick="switchTab('record')">記録</button>
        <button id="btn-tab-list" class="tab-btn" onclick="switchTab('list')">一覧</button>
        <button id="btn-tab-stats" class="tab-btn" onclick="switchTab('stats')">統計</button>
    </div>

    <div id="tab-record" class="container active">
        <h1 id="formTitle">📊 新規トレード記録</h1>
        <input type="hidden" id="editingId" value="">
        
        <div class="flex-row">
            <div class="form-group">
                <label>日にち</label>
                <input type="date" id="tradeDate">
            </div>
            <div class="form-group">
                <label>日本時間 (JST)</label>
                <input type="text" id="tradeTime" placeholder="時間または下の変換を使用">
            </div>
        </div>

        <div class="form-group convert-box">
            <label style="margin-bottom:4px;">⏰ 海外時間(時差-6時間)を変換</label>
            <div class="flex-row">
                <input type="text" id="foreignTimeInput" placeholder="例: 7:41" autocomplete="off">
                <button type="button" class="action-btn" onclick="runTimeConverter()" style="margin:0; width:auto; padding:0 15px;">変換</button>
            </div>
            <label class="switch-label">
                <input type="checkbox" id="isSummerTime"> ▢ 夏時間（サマータイム適用時はチェック）
            </label>
        </div>

        <div class="form-group">
            <label>市場</label>
            <div class="btn-group" id="marketGroup">
                <button type="button" class="select-btn" data-type="market" data-val="アジア">アジア</button>
                <button type="button" class="select-btn" data-type="market" data-val="ロンドン">ロンドン</button>
                <button type="button" class="select-btn" data-type="market" data-val="ニューヨーク">ニューヨーク</button>
            </div>
        </div>

        <div class="form-group">
            <label>通貨ペア / 銘柄</label>
            <div class="btn-group" id="pairGroup">
                <button type="button" class="select-btn" data-type="pair" data-val="XAUUSD">XAUUSD</button>
                <button type="button" class="select-btn" data-type="pair" data-val="BTCUSD">BTCUSD</button>
                <button type="button" class="select-btn" data-type="pair" data-val="OIL">OIL</button>
                <button type="button" class="select-btn" data-type="pair" data-val="USDJPY">USDJPY</button>
                <button type="button" class="select-btn" data-type="pair" data-val="EURUSD">EURUSD</button>
                <button type="button" class="select-btn" data-type="pair" data-val="AUDJPY">AUDJPY</button>
                <button type="button" class="select-btn" data-type="pair" data-val="AUDUSD">AUDUSD</button>
                <button type="button" class="select-btn" data-type="pair" data-val="EURJPY">EURJPY</button>
                <button type="button" class="select-btn" data-type="pair" data-val="その他">その他</button>
            </div>
            <input type="text" id="customPairInput" placeholder="通貨ペアを手入力してください">
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label>月足</label>
                <div class="btn-group" id="monthlyGroup">
                    <button type="button" class="select-btn" data-type="monthly" data-val="陽線">陽線</button>
                    <button type="button" class="select-btn" data-type="monthly" data-val="陰線">陰線</button>
                </div>
            </div>
            <div class="form-group">
                <label>週足</label>
                <div class="btn-group" id="weeklyGroup">
                    <button type="button" class="select-btn" data-type="weekly" data-val="陽線">陽線</button>
                    <button type="button" class="select-btn" data-type="weekly" data-val="陰線">陰線</button>
                </div>
            </div>
            <div class="form-group">
                <label>日足</label>
                <div class="btn-group" id="dailyGroup">
                    <button type="button" class="select-btn" data-type="daily" data-val="陽線">陽線</button>
                    <button type="button" class="select-btn" data-type="daily" data-val="陰線">陰線</button>
                </div>
            </div>
        </div>

        <div class="form-group">
            <label>目線</label>
            <div class="btn-group" id="biasGroup">
                <button type="button" class="select-btn" data-type="bias" data-val="ロング">ロング</button>
                <button type="button" class="select-btn" data-type="bias" data-val="ショート">ショート</button>
                <button type="button" class="select-btn" data-type="bias" data-val="レンジ">レンジ</button>
            </div>
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label>売買</label>
                <div class="btn-group" id="sideGroup">
                    <button type="button" class="select-btn" data-type="side" data-val="Long">ロング</button>
                    <button type="button" class="select-btn" data-type="side" data-val="Short">ショート</button>
                </div>
            </div>
            <div class="form-group">
                <label>結果</label>
                <div class="btn-group" id="resultGroup">
                    <button type="button" class="select-btn" data-type="result" data-val="勝ち">勝ち</button>
                    <button type="button" class="select-btn" data-type="result" data-val="負け">負け</button>
                    <button type="button" class="select-btn" data-type="result" data-val="建値">建値</button>
                </div>
            </div>
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label>Open 価格</label>
                <input type="number" id="openPriceInput" step="any" placeholder="例: 3000.00" oninput="autoCalculatePips()">
            </div>
            <div class="form-group">
                <label>Close 価格</label>
                <input type="number" id="closePriceInput" step="any" placeholder="例: 3010.50" oninput="autoCalculatePips()">
            </div>
        </div>
        <div class="flex-row">
            <div class="form-group">
                <label>TP 価格</label>
                <input type="number" id="tpPriceInput" step="any" placeholder="例: 3050.00">
            </div>
            <div class="form-group">
                <label>SL 価格</label>
                <input type="number" id="slPriceInput" step="any" placeholder="例: 2980.00">
            </div>
        </div>

        <div class="flex-row">
            <div class="form-group">
                <label>ロット数</label>
                <input type="number" id="lotInput" step="any" placeholder="0.1" oninput="autoCalculatePips()">
            </div>
            <div class="form-group">
                <label>獲得PIPS (自動計算・手動可)</label>
                <input type="number" id="pipsInput" step="any" placeholder="自動計算されます">
            </div>
            <div class="form-group">
                <label>損益額 (USD)</label>
                <input type="number" id="pnlInput" step="any" placeholder="50">
            </div>
        </div>

        <div class="form-group">
            <label>感情</label>
            <div class="btn-group" id="emotionGroup">
                <button type="button" class="select-btn" data-type="emotion" data-val="冷静">冷静</button>
                <button type="button" class="select-btn" data-type="emotion" data-val="焦り">焦り</button>
                <button type="button" class="select-btn" data-type="emotion" data-val="不安">不安</button>
            </div>
        </div>

        <div class="form-group">
            <label>メモ（根拠や反省点）</label>
            <textarea id="memoInput" placeholder="エントリーした環境認識や、トレード後の反省など..."></textarea>
        </div>

        <button type="button" class="action-btn" id="submitBtn" onclick="saveTradeLog()">このトレードを保存する</button>
    </div>

    <div id="tab-list" class="container">
        <div class="list-header">
            <div class="count-text" id="totalCountText">0 件の記録</div>
            <button class="nav-trigger-btn" onclick="clearFormAndGoToRecord()">＋ 新規記録</button>
        </div>

        <div id="cardContainer"></div>

        <div class="backup-section">
            <p style="font-size:13px; color:var(--text-muted); margin-bottom:10px;">データのバックアップ / 出力選択</p>
            <button class="backup-btn" onclick="exportToCSV()">Excel用にCSVでダウンロード</button>
            <button class="backup-btn" onclick="exportToText()">引っ越し用にテキストをコピー</button>
            <button class="backup-btn" onclick="importFromText()" style="background-color:#2c3e50;">データをテキストから復元</button>
            <br>
            <button onclick="clearAllData()" style="background:none; border:none; color:var(--color-lose); font-size:12px; margin-top:15px; cursor:pointer;">全てのデータを初期化する</button>
        </div>
    </div>

    <div id="tab-stats" class="container">
        <h1>📈 トレード統計分析</h1>
        
        <div class="stat-grid">
            <div class="stat-card">
                <div style="font-size:13px; color:var(--text-muted);">総トレード数</div>
                <div class="stat-val" id="statTotalTrades">0</div>
            </div>
            <div class="stat-card">
                <div style="font-size:13px; color:var(--text-muted);">総合勝率</div>
                <div class="stat-val" id="statWinRate" style="color:var(--color-win)">0%</div>
                <div style="font-size:11px; color:var(--text-muted);" id="statWLD">0勝 0敗 0分</div>
            </div>
            <div class="stat-card">
                <div style="font-size:13px; color:var(--text-muted);">総損益額</div>
                <div class="stat-val" id="statTotalPnl">0 USD</div>
            </div>
            <div class="stat-card">
                <div style="font-size:13px; color:var(--text-muted);">総獲得PIPS</div>
                <div class="stat-val" id="statTotalPips">0 pips</div>
            </div>
        </div>

        <h2>🧠 感情トレード率</h2>
        <div class="stat-list" id="emotionStatList"></div>

        <h2>💱 通貨ペア別成績</h2>
        <div class="stat-list" id="pairStatList"></div>
    </div>

    <script>
        window.onload = function() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tradeDate').value = today;
            
            setupButtonGroups();
            refreshApp();
        };

        // タブ切り替え
        function switchTab(tabName) {
            document.querySelectorAll('.container').forEach(c => c.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById(`tab-${tabName}`).classList.add('active');
            document.getElementById(`btn-tab-${tabName}`).classList.add('active');

            if(tabName === 'list' || tabName === 'stats') {
                refreshApp();
            }
        }

        function clearFormAndGoToRecord() {
            setFormToNewMode();
            switchTab('record');
        }

        // ボタングループ管理
        function setupButtonGroups() {
            document.querySelectorAll('.btn-group').forEach(group => {
                group.addEventListener('click', e => {
                    if (e.target.classList.contains('select-btn')) {
                        // トグル選択処理（未選択を許可）
                        if (e.target.classList.contains('active')) {
                            e.target.classList.remove('active');
                        } else {
                            group.querySelectorAll('.select-btn').forEach(btn => btn.classList.remove('active'));
                            e.target.classList.add('active');
                        }
                        
                        if (e.target.getAttribute('data-type') === 'pair') {
                            const customInput = document.getElementById('customPairInput');
                            if (e.target.getAttribute('data-val') === 'その他' && e.target.classList.contains('active')) {
                                customInput.style.display = 'block';
                            } else {
                                customInput.style.display = 'none';
                            }
                        }

                        // 結果や売買などの変動で自動PIPS計算をトリガー
                        autoCalculatePips();
                    }
                });
            });
        }

        function activateButtonInGroup(groupId, value) {
            const group = document.getElementById(groupId);
            if (!group) return;
            group.querySelectorAll('.select-btn').forEach(btn => {
                if(value && btn.getAttribute('data-val') === value) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // ─── 【修正：獲得PIPS数の自動計算ロジック (*100に変更)】 ───
        function autoCalculatePips() {
            const openVal = document.getElementById('openPriceInput').value;
            const closeVal = document.getElementById('closePriceInput').value;
            const lotVal = document.getElementById('lotInput').value;
            const result = getSelectedVal('resultGroup');

            // 必須数値が揃っていない場合は計算スキップ
            if (openVal === "" || closeVal === "" || lotVal === "") {
                return;
            }

            const openPrice = parseFloat(openVal);
            const closePrice = parseFloat(closeVal);
            const lot = parseFloat(lotVal);

            // 絶対値の計算式を修正: |Close - Open| * (ロット数 * 100)
            let pipsValue = Math.abs(closePrice - openPrice) * (lot * 100);

            // 負けを選んだ場合はマイナスをつける
            if (result === '負け') {
                pipsValue = -Math.abs(pipsValue);
            } else {
                pipsValue = Math.abs(pipsValue);
            }

            // 小数点第2位までに丸めて代入
            document.getElementById('pipsInput').value = parseFloat(pipsValue.toFixed(2));
        }

        // 時間変換 ＆ 市場自動判別
        function runTimeConverter() {
            const timeStr = document.getElementById('foreignTimeInput').value.trim();
            const isSummer = document.getElementById('isSummerTime').checked;
            
            const timeRegex = /^([0-1]?[0-9]|2[0-3]):([0-5][0-9])$/;
            if (!timeRegex.test(timeStr)) {
                alert("お時間は「7:41」のように半角コロンで区切って入力してくださいね。");
                return;
            }

            const [hours, minutes] = timeStr.split(':').map(Number);
            let jstHours = (hours + 6) % 24;
            const formattedTime = `${String(jstHours).padStart(2, '0')}:${String(minutes).padStart(2, '0')}`;
            document.getElementById('tradeTime').value = formattedTime;

            let market = "";
            let asiaStart = 8, asiaEnd = 16;
            let lonStart = isSummer ? 15 : 16;
            let lonEnd = isSummer ? 23 : 24;

            if (jstHours >= asiaStart && jstHours < asiaEnd) {
                market = "アジア";
            } else if (jstHours >= lonStart && jstHours < lonEnd) {
                market = "ロンドン";
            } else {
                if (isSummer) {
                    if (jstHours >= 23 || jstHours < 6) market = "ニューヨーク";
                } else {
                    if (jstHours >= 0 && jstHours < 7) market = "ニューヨーク";
                }
            }

            if(!market) market = "アジア"; 
            activateButtonInGroup('marketGroup', market);
        }

        function getSelectedVal(groupId) {
            const activeBtn = document.querySelector(`#${groupId} .select-btn.active`);
            return activeBtn ? activeBtn.getAttribute('data-val') : "";
        }

        // データ保存・更新
        function saveTradeLog() {
            const date = document.getElementById('tradeDate').value;
            const time = document.getElementById('tradeTime').value.trim();
            let pair = getSelectedVal('pairGroup');
            
            if (!date || !time || !pair) {
                alert("日にち、時間、通貨ペアは必ず選んで入力してくださいね。");
                return;
            }

            if (pair === 'その他') {
                pair = document.getElementById('customPairInput').value.trim() || "その他";
            }

            const editingId = document.getElementById('editingId').value;
            const pips = document.getElementById('pipsInput').value;
            const pnl = document.getElementById('pnlInput').value;

            const logData = {
                date,
                time,
                market: getSelectedVal('marketGroup') || "-",
                pair,
                monthly: getSelectedVal('monthlyGroup') || "-",
                weekly: getSelectedVal('weeklyGroup') || "-",
                daily: getSelectedVal('dailyGroup') || "-",
                bias: getSelectedVal('biasGroup') || "-",
                side: getSelectedVal('sideGroup') || "-",
                result: getSelectedVal('resultGroup') || "-",
                openPrice: document.getElementById('openPriceInput').value || "-",
                closePrice: document.getElementById('closePriceInput').value || "-",
                tpPrice: document.getElementById('tpPriceInput').value || "-",
                slPrice: document.getElementById('slPriceInput').value || "-",
                lot: document.getElementById('lotInput').value || "-",
                pips: pips !== "" ? parseFloat(pips) : 0,
                pnl: pnl !== "" ? parseFloat(pnl) : 0,
                emotion: getSelectedVal('emotionGroup') || "-",
                memo: document.getElementById('memoInput').value.trim() || "-"
            };

            let trades = JSON.parse(localStorage.getItem('dark_trades')) || [];

            if (editingId) {
                trades = trades.map(t => {
                    if (t.id === parseInt(editingId)) {
                        return { ...t, ...logData };
                    }
                    return t;
                });
                alert("記録を更新いたしましたわ！");
            } else {
                logData.id = Date.now();
                trades.unshift(logData);
                alert("トレードを保存いたしましたわ！");
            }

            localStorage.setItem('dark_trades', JSON.stringify(trades));
            setFormToNewMode();
            refreshApp();
            switchTab('list');
        }

        function setFormToNewMode() {
            document.getElementById('editingId').value = "";
            document.getElementById('formTitle').innerText = "📊 新規トレード記録";
            document.getElementById('submitBtn').innerText = "このトレードを保存する";

            document.getElementById('tradeTime').value = "";
            document.getElementById('foreignTimeInput').value = "";
            document.getElementById('openPriceInput').value = "";
            document.getElementById('closePriceInput').value = "";
            document.getElementById('tpPriceInput').value = "";
            document.getElementById('slPriceInput').value = "";
            document.getElementById('lotInput').value = "";
            document.getElementById('pipsInput').value = "";
            document.getElementById('pnlInput').value = "";
            document.getElementById('memoInput').value = "";
            document.getElementById('customPairInput').value = "";
            document.getElementById('customPairInput').style.display = "none";
            document.querySelectorAll('.select-btn').forEach(btn => btn.classList.remove('active'));
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('tradeDate').value = today;
        }

        // 編集モード
        function editTrade(id) {
            const trades = JSON.parse(localStorage.getItem('dark_trades')) || [];
            const t = trades.find(item => item.id === id);
            if (!t) return;

            document.getElementById('editingId').value = t.id;
            document.getElementById('formTitle').innerText = "🔧 トレード記録を編集";
            document.getElementById('submitBtn').innerText = "修正内容を更新する";

            document.getElementById('tradeDate').value = t.date;
            document.getElementById('tradeTime').value = t.time;
            document.getElementById('openPriceInput').value = t.openPrice === "-" ? "" : t.openPrice;
            document.getElementById('closePriceInput').value = t.closePrice === "-" ? "" : t.closePrice;
            document.getElementById('tpPriceInput').value = t.tpPrice === "-" ? "" : t.tpPrice;
            document.getElementById('slPriceInput').value = t.slPrice === "-" ? "" : t.slPrice;
            document.getElementById('lotInput').value = t.lot === "-" ? "" : t.lot;
            document.getElementById('pipsInput').value = t.pips;
            document.getElementById('pnlInput').value = t.pnl;
            document.getElementById('memoInput').value = t.memo === "-" ? "" : t.memo;

            activateButtonInGroup('marketGroup', t.market);
            activateButtonInGroup('monthlyGroup', t.monthly);
            activateButtonInGroup('weeklyGroup', t.weekly);
            activateButtonInGroup('dailyGroup', t.daily);
            activateButtonInGroup('biasGroup', t.bias);
            activateButtonInGroup('sideGroup', t.side);
            activateButtonInGroup('resultGroup', t.result);
            activateButtonInGroup('emotionGroup', t.emotion);

            const basePairs = ["XAUUSD", "BTCUSD", "OIL", "USDJPY", "EURUSD", "AUDJPY", "AUDUSD", "EURJPY"];
            if (basePairs.includes(t.pair)) {
                activateButtonInGroup('pairGroup', t.pair);
                document.getElementById('customPairInput').style.display = "none";
            } else {
                activateButtonInGroup('pairGroup', "その他");
                const customInput = document.getElementById('customPairInput');
                customInput.style.display = "block";
                customInput.value = t.pair;
            }

            switchTab('record');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 一覧・統計の表示リフレッシュ
        function refreshApp() {
            const trades = JSON.parse(localStorage.getItem('dark_trades')) || [];
            document.getElementById('totalCountText').innerText = `${trades.length} 件の記録`;

            const cardContainer = document.getElementById('cardContainer');
            cardContainer.innerHTML = "";

            if(trades.length === 0) {
                cardContainer.innerHTML = `<p style="text-align:center; color:var(--text-muted); margin-top:30px;">まだ記録がありませんわ。【記録】タブから追加してくださいね。</p>`;
            } else {
                trades.forEach(t => {
                    const card = document.createElement('div');
                    card.className = 'trade-card';
                    
                    let pnlColor = 'var(--text-color)';
                    if (t.pnl > 0) pnlColor = 'var(--color-win)';
                    if (t.pnl < 0) pnlColor = 'var(--color-lose)';

                    let envStr = "";
                    if(t.monthly && t.monthly !== "-") envStr += `月:${t.monthly} `;
                    if(t.weekly && t.weekly !== "-") envStr += `週:${t.weekly} `;
                    if(t.daily && t.daily !== "-") envStr += `日:${t.daily} `;
                    if(t.bias && t.bias !== "-") envStr += `目線:${t.bias}`;

                    card.innerHTML = `
                        <div class="card-row1">
                            <span>📅 ${t.date} ${t.time} (${t.market}市場)</span>
                            <span>🧠 感情: ${t.emotion || "-"}</span>
                        </div>
                        <div class="card-row2">
                            ${t.side && t.side !== "-" ? `<span class="badge ${t.side}">${t.side === 'Long' ? 'ロング' : 'ショート'}</span>` : ''}
                            ${t.result && t.result !== "-" ? `<span class="badge ${t.result}">${t.result}</span>` : ''}
                            <span class="card-pair">${t.pair}</span>
                            ${envStr ? `<span class="badge env">${envStr}</span>` : ''}
                        </div>
                        <div class="card-prices">
                            <span>Open: ${t.openPrice}</span>
                            <span>Close: ${t.closePrice}</span>
                            <span>TP: ${t.tpPrice}</span>
                            <span>SL: ${t.slPrice}</span>
                        </div>
                        <div class="card-metrics">
                            <div>ロット: <span style="font-weight:bold;">${t.lot}</span></div>
                            <div>獲得: <span style="font-weight:bold; color:${t.pips >= 0 ? 'var(--color-win)':'var(--color-lose)'}">${t.pips} pips</span></div>
                            <div>損益: <span style="font-weight:bold; color:${pnlColor}">${t.pnl} USD</span></div>
                        </div>
                        <div class="card-memo">${t.memo.replace(/\n/g, '<br>')}</div>
                        
                        <div class="card-footer">
                            <button class="card-op-btn edit" onclick="editTrade(${t.id})">🔧 編集</button>
                            <button class="card-op-btn delete" onclick="deleteTrade(${t.id})">🗑️ 削除</button>
                        </div>
                    `;
                    cardContainer.appendChild(card);
                });
            }

            calculateStatistics(trades);
        }

        function deleteTrade(id) {
            if(confirm("このトレード記録を削除してもよろしくて？")) {
                let trades = JSON.parse(localStorage.getItem('dark_trades')) || [];
                trades = trades.filter(t => t.id !== id);
                localStorage.setItem('dark_trades', JSON.stringify(trades));
                refreshApp();
            }
        }

        // 統計計算
        function calculateStatistics(trades) {
            const total = trades.length;
            document.getElementById('statTotalTrades').innerText = total;

            if(total === 0) {
                document.getElementById('statWinRate').innerText = "0%";
                document.getElementById('statWLD').innerText = "0勝 0敗 0分";
                document.getElementById('statTotalPnl').innerText = "0 USD";
                document.getElementById('statTotalPips').innerText = "0 pips";
                document.getElementById('emotionStatList').innerHTML = "データがありません";
                document.getElementById('pairStatList').innerHTML = "データがありません";
                return;
            }

            let wins = 0, loses = 0, draws = 0;
            let totalPnl = 0, totalPips = 0;
            let emotions = { 冷静: 0, 焦り: 0, 不安: 0, "-": 0 };
            let pairs = {};

            trades.forEach(t => {
                if (t.result === '勝ち') wins++;
                else if (t.result === '負け') loses++;
                else if (t.result === '建値') draws++;

                totalPnl += t.pnl;
                totalPips += t.pips;

                if(emotions[t.emotion] !== undefined) emotions[t.emotion]++;

                if(!pairs[t.pair]) {
                    pairs[t.pair] = { total: 0, wins: 0, loses: 0, draws: 0 };
                }
                pairs[t.pair].total++;
                if (t.result === '勝ち') pairs[t.pair].wins++;
                else if (t.result === '負け') pairs[t.pair].loses++;
                else if (t.result === '建値') pairs[t.pair].draws++;
            });

            const winRate = ((wins / (wins + loses || 1)) * 100).toFixed(1);
            document.getElementById('statWinRate').innerText = `${winRate}%`;
            document.getElementById('statWLD').innerText = `${wins}勝 ${loses}敗 ${draws}分`;
            
            document.getElementById('statTotalPnl').innerText = `${totalPnl.toFixed(2)} USD`;
            document.getElementById('statTotalPnl').style.color = totalPnl >= 0 ? 'var(--color-win)' : 'var(--color-lose)';
            document.getElementById('statTotalPips').innerText = `${totalPips.toFixed(1)} pips`;
            document.getElementById('statTotalPips').style.color = totalPips >= 0 ? 'var(--color-win)' : 'var(--color-lose)';

            const emotionContainer = document.getElementById('emotionStatList');
            emotionContainer.innerHTML = "";
            let validEmotionTotal = total - emotions["-"];
            for (let key in emotions) {
                if(key === "-") continue;
                const count = emotions[key];
                const rate = validEmotionTotal > 0 ? ((count / validEmotionTotal) * 100).toFixed(1) : "0.0";
                const item = document.createElement('div');
                item.className = 'stat-item';
                item.innerHTML = `<span>${key}</span><span>${rate}% (${count}回)</span>`;
                emotionContainer.appendChild(item);
            }

            const pairContainer = document.getElementById('pairStatList');
            pairContainer.innerHTML = "";
            for (let p in pairs) {
                const pData = pairs[p];
                const pRate = ((pData.wins / (pData.wins + pData.loses || 1)) * 100).toFixed(1);
                const item = document.createElement('div');
                item.className = 'stat-item';
                item.innerHTML = `
                    <span style="font-weight:bold;">${p}</span>
                    <span>勝率 ${pRate}% <small style="color:var(--text-muted)">(${pData.wins}勝 ${pData.loses}敗 ${pData.draws}分)</small></span>
                `;
                pairContainer.appendChild(item);
            }
        }

        // CSV出力
        function exportToCSV() {
            const trades = JSON.parse(localStorage.getItem('dark_trades')) || [];
            if(trades.length === 0) { alert("出力するデータがありませんわ。"); return; }

            let csvContent = "\uFEFF"; 
            csvContent += "日にち,時間,市場,通貨ペア,月足,週足,日足,目線,売買,結果,Open,Close,TP,SL,ロット,獲得PIPS,損益額USD,感情,メモ\n";

            trades.forEach(t => {
                const row = [
                    t.date, t.time, t.market, t.pair, t.monthly, t.weekly, t.daily, t.bias, t.side, t.result,
                    t.openPrice, t.closePrice, t.tpPrice, t.slPrice, t.lot, t.pips, t.pnl, t.emotion, `"${t.memo.replace(/"/g, '""')}"`
                ].join(",");
                csvContent += row + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `trade_log_${new Date().toISOString().split('T')[0]}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function exportToText() {
            const trades = localStorage.getItem('dark_trades');
            if(!trades || trades === "[]") { alert("出力するデータがありませんわ。"); return; }
            navigator.clipboard.writeText(trades).then(() => {
                alert("テキストをコピーしましたわ！");
            });
        }

        function importFromText() {
            const jsonText = prompt("データをここに貼り付けてくださいわ。");
            if(!jsonText) return;
            try {
                const parsed = JSON.parse(jsonText);
                if (Array.isArray(parsed)) {
                    if(confirm("データを上書き復元してもよろしくて？")) {
                        localStorage.setItem('dark_trades', JSON.stringify(parsed));
                        refreshApp();
                        alert("復元完了いたしましたわ！");
                    }
                }
            } catch(e) { alert("失敗しました。"); }
        }

        function clearAllData() {
            if(confirm("本当に全て削除しますの？")) {
                localStorage.removeItem('dark_trades');
                refreshApp();
            }
        }
    </script>
</body>
